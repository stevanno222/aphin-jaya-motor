<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD BAPAK - APHIN JAYA MOTOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- LOGIN PIN MODAL -->
    <div id="pin-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-1">Akses Mode Bapak</h2>
            <p class="text-xs text-slate-400 mb-4">Masukkan PIN Rahasia Pemilik Toko (Default: 1234)</p>
            <form onsubmit="event.preventDefault(); checkPin();">
                <input type="password" id="pin-input" maxlength="4" placeholder="••••" class="w-full text-center text-2xl tracking-widest px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-blue-500 mb-4">
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold text-white rounded-xl transition">Masuk Dashboard</button>
            </form>
            <p id="pin-error" class="text-xs text-red-400 mt-2 hidden">PIN Salah! Coba lagi.</p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden min-h-screen flex flex-col">
        <!-- HEADER -->
        <header class="bg-slate-900 border-b border-slate-800 p-4 px-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-amber-500 text-slate-950 font-bold rounded-xl flex items-center justify-center text-lg">
                    <i class="fa-solid fa-shop"></i>
                </div>
                <div>
                    <h1 class="font-bold text-white text-base md:text-lg">DASHBOARD PEMILIK (BAPAK)</h1>
                    <p class="text-xs font-semibold text-emerald-400 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Realtime Connected
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="changePin()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg">Ubah PIN</button>
                <button onclick="lockMode()" class="px-3 py-1.5 bg-red-600/20 text-red-400 border border-red-500/30 hover:bg-red-600 hover:text-white text-xs font-semibold rounded-lg transition">Kunci Mode</button>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- LIST PESANAN MASUK -->
            <div class="lg:col-span-2 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-lg text-white flex items-center gap-2">
                        <i class="fa-solid fa-bell text-amber-400 animate-bounce"></i> Pesanan Masuk Pelanggan
                    </h3>
                    <button onclick="clearOrders()" class="text-xs text-slate-500 hover:text-red-400">Bersihkan Riwayat</button>
                </div>

                <div id="orders-list" class="space-y-3">
                    <!-- Orders item rendered here -->
                </div>
            </div>

            <!-- REKAP SARAN STOK (DEMAND) -->
            <div class="space-y-4">
                <h3 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-blue-400"></i> Rekomendasi Permintaan Stok
                </h3>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <ul id="demand-list" class="space-y-2 text-xs text-slate-300 divide-y divide-slate-800">
                        <li class="pb-2 text-slate-500 text-center">Belum ada saran dari pelanggan.</li>
                    </ul>
                </div>
            </div>

        </main>
    </div>

    <!-- AUDIO NOTIFIKASI -->
    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        // INISIALISASI FIREBASE REALTIME DATABASE
        const firebaseConfig = {
            databaseURL: "https://aphin-jaya-motor-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentPin = localStorage.getItem('aphin_bapak_pin') || '1234';
        let isInitialLoad = true;
        let previousOrderCount = 0;

        function checkPin() {
            const input = document.getElementById('pin-input').value;
            if (input === currentPin) {
                document.getElementById('pin-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                initFirebaseListeners();
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
            }
        }

        function lockMode() {
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-screen').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }

        function changePin() {
            const newP = prompt("Masukkan 4 angka PIN Baru Bapak:");
            if (newP && newP.length === 4 && !isNaN(newP)) {
                currentPin = newP;
                localStorage.setItem('aphin_bapak_pin', newP);
                alert("PIN Berhasil diubah!");
            } else {
                alert("PIN harus berupa 4 digit angka!");
            }
        }

        // LISTEN DATA REALTIME DARI FIREBASE
        function initFirebaseListeners() {
            
            // 1. LISTEN PESANAN
            db.ref('orders').on('value', (snapshot) => {
                const list = document.getElementById('orders-list');
                list.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    list.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-500 text-sm">Belum ada pesanan masuk saat ini.</div>`;
                    previousOrderCount = 0;
                    return;
                }

                const keys = Object.keys(data);
                const currentCount = keys.length;

                // Bunyikan notifikasi jika ada pesanan baru masuk
                if (!isInitialLoad && currentCount > previousOrderCount) {
                    document.getElementById('notif-sound').play().catch(() => {});
                }
                previousOrderCount = currentCount;
                isInitialLoad = false;

                // Render pesanan (terbaru di atas)
                keys.reverse().forEach(key => {
                    const o = data[key];
                    let statusBadge = `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-md text-xs font-bold">Menunggu Action</span>`;
                    if (o.status === 'ready') statusBadge = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-md text-xs font-bold">Barang Ada</span>`;
                    if (o.status === 'empty') statusBadge = `<span class="bg-red-500/10 text-red-400 border border-red-500/20 px-2 py-0.5 rounded-md text-xs font-bold">Stok Habis</span>`;

                    list.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col md:flex-row justify-between md:items-center gap-4">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="font-bold text-white text-base">${o.customer}</span>
                                    <span class="text-xs text-slate-400">(${o.payment})</span>
                                    ${statusBadge}
                                </div>
                                <p class="text-sm font-semibold text-blue-400">${o.product}</p>
                                <p class="text-[10px] text-slate-500 mt-1">Waktu: ${o.time || '-'}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="updateStatus('${key}', 'ready')" class="flex-1 md:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition">
                                    <i class="fa-solid fa-check"></i> Barang Ada
                                </button>
                                <button onclick="updateStatus('${key}', 'empty')" class="flex-1 md:flex-none px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl transition">
                                    <i class="fa-solid fa-xmark"></i> Gak Ada Stock
                                </button>
                                <button onclick="deleteSingleOrder('${key}')" title="Hapus pesanan ini" class="px-3 py-2 bg-slate-800 hover:bg-red-600/30 text-slate-400 hover:text-red-400 border border-slate-700 rounded-xl text-xs transition">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            });

            // 2. LISTEN REKOMENDASI STOK (DEMAND)
            db.ref('demands').on('value', (snapshot) => {
                const list = document.getElementById('demand-list');
                const data = snapshot.val();
                if (!data) {
                    list.innerHTML = '<li class="pb-2 text-slate-500 text-center">Belum ada saran dari pelanggan.</li>';
                    return;
                }
                list.innerHTML = '';
                Object.values(data).reverse().forEach(d => {
                    list.innerHTML += `
                        <li class="pt-2 flex justify-between items-center">
                            <span class="font-medium text-slate-200">${d.item}</span>
                            <span class="text-[10px] text-slate-500">${d.time || d.date || ''}</span>
                        </li>
                    `;
                });
            });
        }

        // UPDATE STATUS PESANAN KE FIREBASE
        function updateStatus(orderId, status) {
            db.ref('orders/' + orderId).update({ status: status });
        }

        // HAPUS 1 PESANAN
        function deleteSingleOrder(orderId) {
            db.ref('orders/' + orderId).remove();
        }

        // BERSIHKAN SEMUA PESANAN
        function clearOrders() {
            if (confirm("Hapus semua riwayat pesanan dari database?")) {
                db.ref('orders').remove();
            }
        }
    </script>
</body>
</html>
